[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-log-analyzer"
version = "0.1.0"
description = "Incrementally analyze application log files."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
remote-log = "main:main"

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.setuptools]
py-modules = ["main"]
